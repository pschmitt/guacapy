[tool.poetry]
name = "guacapy"
version = "1.20251014.1"
description = "A Python client for the Apache Guacamole REST API"
authors = ["Philipp Schmitt <philipp@schmitt.co>", "Dax Mickelson <github@daxm.net>"]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
requests = [
    { version = "2.32.5", python = ">=3.9,<3.10" }, # HTTP request library for Python 3.9
    { version = "2.34.2", python = ">=3.10" },
]

[tool.poetry.group.dev.dependencies]
mypy = [
    { version = "1.19.1", python = ">=3.9,<3.10" }, # Latest line supporting Python 3.9
    { version = "^2.0.0", python = ">=3.10" },
]
black = [
    { version = "25.11.0", python = ">=3.9,<3.10" }, # Latest line supporting Python 3.9
    { version = "^26.0.0", python = ">=3.10" },
]
flake8 = "^7.3.0"     # Linter

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 80

[tool.flake8]
max-line-length = 120
